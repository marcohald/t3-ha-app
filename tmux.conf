# Minimal tmux configuration for T3 Code Home Assistant add-on
# Hide status bar
set -g status off

# Enable truecolor
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Don't delay ESC key
set -sg escape-time 0

# Disable tmux mouse interception so xterm.js has native mobile/desktop selection
set -g mouse off
set -s set-clipboard on

# Set scrollback history limit
set -g history-limit 50000

# Disable alternate screen for native scrollback
set-option -ga terminal-overrides ',xterm*:smcup@:rmcup@'
