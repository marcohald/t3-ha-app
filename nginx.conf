worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       62901;
        server_name  localhost;

        # Serve custom T3 Code UI wrapper
        location / {
            root   /opt/t3code/html;
            index  index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }

        # Proxy ttyd and websockets
        location /ttyd/ {
            proxy_pass http://127.0.0.1:62905;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Proxy file uploads
        location /upload {
            proxy_pass http://127.0.0.1:62906/upload;
            proxy_set_header Host $host;
            client_max_body_size 0;
        }

        # Proxy kill requests
        location /kill {
            proxy_pass http://127.0.0.1:62906/kill;
            proxy_set_header Host $host;
        }

        # Proxy backup export
        location /export_backup {
            proxy_pass http://127.0.0.1:62906/export_backup;
            proxy_set_header Host $host;
        }

        # Proxy backup import
        location /import_chunk {
            proxy_pass http://127.0.0.1:62906/import_chunk;
            proxy_set_header Host $host;
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Proxy version check and update
        location /version_check {
            proxy_pass http://127.0.0.1:62906/version_check;
            proxy_set_header Host $host;
        }

        location /update_cli {
            proxy_pass http://127.0.0.1:62906/update_cli;
            proxy_set_header Host $host;
        }

        # Proxy T3 Code pairing, status & restart endpoints
        location /t3_pair {
            proxy_pass http://127.0.0.1:62906/t3_pair;
            proxy_set_header Host $host;
        }

        location /t3_status {
            proxy_pass http://127.0.0.1:62906/t3_status;
            proxy_set_header Host $host;
        }

        location /t3_restart {
            proxy_pass http://127.0.0.1:62906/t3_restart;
            proxy_set_header Host $host;
        }

        # Proxy T3 Connect remote access endpoints
        location /t3_connect_status {
            proxy_pass http://127.0.0.1:62906/t3_connect_status;
            proxy_set_header Host $host;
        }

        location /t3_connect_link {
            proxy_pass http://127.0.0.1:62906/t3_connect_link;
            proxy_set_header Host $host;
        }
    }
}
