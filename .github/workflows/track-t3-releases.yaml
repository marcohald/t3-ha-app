name: Track T3 Code releases

# Watches pingdotgg/t3code for stable releases. When a newer one appears this
# workflow:
#   1. writes the new pin to t3-version.txt,
#   2. bumps the add-on version in config.yaml (so the Home Assistant Add-on
#      Store offers an update),
#   3. adds a CHANGELOG entry with the upstream release notes,
#   4. commits and pushes to main,
#   5. builds and publishes the amd64/aarch64 images plus their multi-arch
#      manifest, verifies both platforms are in the manifest, and creates the
#      GitHub release.
#
# The image build runs here rather than in builder.yaml because a push made
# with the repository's own GITHUB_TOKEN does not trigger other workflows, so a
# push-triggered builder would never run for a release commit. builder.yaml
# still builds normal pushes (and skips `chore(release):` commits).
#
# Add-on version scheme: 1.<T3 minor>.<T3 patch>. T3 0.1.10 is add-on 1.1.10,
# T3 0.1.11 is add-on 1.1.11, T3 0.2.0 is add-on 1.2.0. The version therefore
# always increases when T3 does, and it names the T3 release it ships.

on:
  schedule:
    # Every six hours. T3 Code ships stable builds most weekdays.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      t3_version:
        description: 'Pin this exact T3 Code version (e.g. 0.1.11). Empty = newest stable release.'
        required: false
        type: string
      dry_run:
        description: 'Only report what would change; do not commit, build or release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: track-t3-releases
  cancel-in-progress: false

env:
  UPSTREAM_REPO: pingdotgg/t3code
  IMAGE_NAME: t3-ha-app
  IMAGE: ghcr.io/${{ github.repository_owner }}/t3-ha-app
  REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}
  ARCHITECTURES: '["amd64", "aarch64"]'

jobs:
  check:
    name: Check upstream for a new stable release
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.detect.outputs.found }}
      version: ${{ steps.detect.outputs.version }}
      addon_version: ${{ steps.detect.outputs.addon_version }}
      previous: ${{ steps.detect.outputs.previous }}
      notes: ${{ steps.detect.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve newest stable release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.t3_version }}
        run: |
          set -euo pipefail

          current="$(tr -d '[:space:]' < t3-version.txt)"
          addon_current="$(sed -n 's/^version: *["'"'"']\?\([^"'"'"']*\)["'"'"']\?/\1/p' config.yaml | head -n1)"
          echo "Pinned T3: ${current:-none} / add-on: ${addon_current:-none}"

          if [[ -n "${REQUESTED}" ]]; then
            release="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/v${REQUESTED#v}")"
          else
            release="$(gh api "repos/${UPSTREAM_REPO}/releases/latest")"
          fi

          tag="$(jq -r '.tag_name' <<< "${release}")"
          prerelease="$(jq -r '.prerelease' <<< "${release}")"
          version="${tag#v}"

          if [[ "${prerelease}" == "true" ]]; then
            echo "::error::${tag} is a prerelease; the add-on only ships stable T3 Code"
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${version}' is not a stable X.Y.Z version"
            exit 1
          fi

          read -r t3_major t3_minor t3_patch <<< "${version//./ }"
          addon_version="1.${t3_minor}.${t3_patch}"

          # sort -V orders the two versions; only a strictly greater one counts.
          newest="$(printf '%s\n%s\n' "${current:-0.0.0}" "${version}" | sort -V | tail -n1)"
          if [[ "${newest}" != "${version}" || "${version}" == "${current}" ]]; then
            echo "::notice::Upstream ${version} is not newer than the pinned ${current:-none}; nothing to do"
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # A T3 release can map onto an add-on version that is already
          # published (a re-cut patch, or a manual bump). The store orders by
          # this number, so it must always increase.
          if [[ -n "${addon_current}" ]]; then
            highest="$(printf '%s\n%s\n' "${addon_current}" "${addon_version}" | sort -V | tail -n1)"
            if [[ "${highest}" != "${addon_version}" ]]; then
              echo "::warning::computed add-on version ${addon_version} is not above ${addon_current}; incrementing its patch"
              IFS=. read -r a_major a_minor a_patch <<< "${addon_current}"
              addon_version="${a_major}.${a_minor}.$((a_patch + 1))"
            fi
          fi

          # Every Linux asset the image build needs must exist before pinning.
          for asset in "t3-${version}-linux-x64.tar.gz" "t3-${version}-linux-arm64.tar.gz" "SHA256SUMS"; do
            if ! curl -fsSIL -o /dev/null \
              "https://github.com/${UPSTREAM_REPO}/releases/download/${tag}/${asset}"; then
              echo "::error::${asset} is missing from ${tag}; not pinning"
              exit 1
            fi
          done

          {
            echo "found=true"
            echo "version=${version}"
            echo "addon_version=${addon_version}"
            echo "previous=${current}"
            echo 'notes<<T3_NOTES_EOF'
            jq -r '.body // ""' <<< "${release}" | head -c 4000
            echo 'T3_NOTES_EOF'
          } >> "${GITHUB_OUTPUT}"

          echo "New release: T3 ${current:-none} -> ${version} (add-on ${addon_version})"

  bump:
    name: Bump pin, add-on version and changelog
    needs: check
    if: needs.check.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the new versions
        env:
          T3_VERSION: ${{ needs.check.outputs.version }}
          T3_PREVIOUS: ${{ needs.check.outputs.previous }}
          ADDON_VERSION: ${{ needs.check.outputs.addon_version }}
          T3_NOTES: ${{ needs.check.outputs.notes }}
        run: |
          set -euo pipefail

          printf '%s\n' "${T3_VERSION}" > t3-version.txt
          sed -i -E "s/^version: *[\"']?[^\"']*[\"']?/version: \"${ADDON_VERSION}\"/" config.yaml

          python3 - "${ADDON_VERSION}" "${T3_VERSION}" "${T3_PREVIOUS:-none}" "${T3_NOTES}" <<'PY'
          import re
          import sys

          addon, t3_version, previous, notes = sys.argv[1:5]

          body = [
              f"## {addon} - T3 Code {t3_version}",
              "",
              f"- ⬆️ **T3 Code {t3_version}**: tracks the upstream stable release"
              f" (previous pin: {previous}).",
              "- 🤖 **Automatic release**: pin, add-on version and images are produced by"
              " `.github/workflows/track-t3-releases.yaml`.",
          ]

          bullets = []
          for line in notes.splitlines():
              # Strip emphasis first: "**Full Changelog**: ..." must still be
              # recognised after the asterisks are gone.
              line = line.strip().replace("**", "").strip()
              line = re.sub(r"^[-*+]\s*", "", line).strip()
              if not line or line.startswith("#"):
                  continue
              if line.lower().startswith("full changelog"):
                  continue
              bullets.append(f"- {line}")
          if bullets:
              body += ["", "### Upstream changes", ""] + bullets
          section = "\n".join(body) + "\n"

          with open("CHANGELOG.md", encoding="utf-8") as fh:
              changelog = fh.read()

          if f"## {addon} " in changelog:
              print(f"CHANGELOG already has a section for {addon}")
              sys.exit(0)

          marker = "# Changelog\n\n"
          if changelog.startswith(marker):
              changelog = marker + section + "\n" + changelog[len(marker):]
          else:
              changelog = "# Changelog\n\n" + section + "\n" + changelog

          with open("CHANGELOG.md", "w", encoding="utf-8") as fh:
              fh.write(changelog)
          PY

          git --no-pager diff

      - name: Report only
        if: inputs.dry_run
        env:
          ADDON_VERSION: ${{ needs.check.outputs.addon_version }}
          T3_VERSION: ${{ needs.check.outputs.version }}
        run: |
          echo "Dry run: would release add-on ${ADDON_VERSION} for T3 Code ${T3_VERSION}"
          git checkout -- .

      - name: Commit and push
        id: commit
        if: ${{ !inputs.dry_run }}
        env:
          ADDON_VERSION: ${{ needs.check.outputs.addon_version }}
          T3_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.yaml CHANGELOG.md t3-version.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit; the pin is already released"
            exit 0
          fi
          git commit -m "chore(release): T3 Code ${T3_VERSION} (add-on ${ADDON_VERSION})"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build-init:
    name: Initialize image build
    needs: [check, bump]
    if: needs.bump.outputs.sha != ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: [check, bump, build-init]
    if: needs.bump.outputs.sha != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-init.outputs.matrix) }}
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.check.outputs.addon_version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=T3 Code
            io.hass.description=AI-assisted coding terminal, T3 Code server with mobile companion app pairing, and T3 Connect remote access
            io.hass.url=https://github.com/marcohald/t3-ha-app
          push: "true"
          version: ${{ needs.check.outputs.addon_version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [check, bump, build]
    if: needs.bump.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.check.outputs.addon_version }}
            latest
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  release:
    name: Verify manifest and create the release
    needs: [check, bump, manifest]
    if: needs.bump.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Verify the published multi-arch manifest
        env:
          VERSION: ${{ needs.check.outputs.addon_version }}
          REGISTRY: ghcr.io
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The Supervisor pulls the multi-arch manifest, so both platforms
          # must be in it before the store advertises the update.
          printf '%s' "${TOKEN}" | docker login "${REGISTRY}" -u "${ACTOR}" --password-stdin >/dev/null
          for attempt in $(seq 1 40); do
            if manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>/dev/null)"; then
              printf '%s\n' "${manifest}"
              for arch in amd64 arm64; do
                grep -q "linux/${arch}" <<< "${manifest}" \
                  || { echo "::error::${IMAGE}:${VERSION} has no linux/${arch} entry"; exit 1; }
              done
              echo "Verified ${IMAGE}:${VERSION} (amd64, arm64)"
              exit 0
            fi
            echo "Waiting for ${IMAGE}:${VERSION} (attempt ${attempt}/40)"
            sleep 15
          done
          echo "::error::${IMAGE}:${VERSION} was not published"
          exit 1

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.addon_version }}
          T3_VERSION: ${{ needs.check.outputs.version }}
          T3_NOTES: ${{ needs.check.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
            exit 0
          fi
          {
            echo "Home Assistant add-on release shipping T3 Code **${T3_VERSION}**."
            echo
            echo "Update via **Settings → Add-ons → T3 Code → Update** (the store checks"
            echo "this repository every few hours)."
            echo
            echo "Image: \`${IMAGE}:${VERSION}\` (amd64, aarch64)"
            echo
            if [[ -n "${T3_NOTES}" ]]; then
              echo "## Upstream changes"
              echo
              printf '%s\n' "${T3_NOTES}"
            fi
          } > /tmp/release-notes.md
          gh release create "v${VERSION}" \
            --title "T3 Code ${T3_VERSION} (add-on ${VERSION})" \
            --notes-file /tmp/release-notes.md \
            --latest

  rollback:
    name: Revert the bump when the release fails
    needs: [check, bump, release]
    if: failure() && needs.check.outputs.found == 'true' && needs.bump.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Revert and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.bump.outputs.sha }}
          ADDON_VERSION: ${{ needs.check.outputs.addon_version }}
        run: |
          set -euo pipefail
          # The version in config.yaml is what the store advertises. If its
          # image never appeared, publishing it would hand users a broken
          # update, so the bump commit is reverted.
          if git revert --no-edit "${SHA}"; then
            git push origin HEAD:main
            echo "::warning::Reverted the ${ADDON_VERSION} bump because its image build failed"
          else
            echo "::error::Could not revert ${SHA}; revert it manually"
            exit 1
          fi
